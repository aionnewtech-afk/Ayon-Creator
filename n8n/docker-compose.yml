# n8n dedicado ao Ayon Creator (Missão 9, Fluxo 13) — instância isolada,
# nunca compartilhada com outros projetos (ver docs/changelog.md, achado da
# auditoria: já existe um n8n rodando para "atendimento-ai-plataform",
# porta 5678, volume/rede próprios daquele projeto — este é um container,
# volume e rede totalmente separados, porta 5679).
#
# Subir:   docker compose -f n8n/docker-compose.yml up -d
# Parar:   docker compose -f n8n/docker-compose.yml down
# UI:      http://localhost:5679
#
# Variáveis em n8n/.env.local (gitignored — ver n8n/.env.local.example).
# ★ Achado real (auditoria de infra pré-Missão 13): a versão anterior deste
# arquivo dependia de `${N8N_ENCRYPTION_KEY}` (interpolação de variável na
# leitura do YAML), que só é resolvida a partir de `--env-file <caminho>` —
# e esse caminho é relativo ao diretório de onde `docker compose` é
# EXECUTADO, não ao diretório deste arquivo. Rodando o comando documentado
# (`-f n8n/docker-compose.yml`, ou seja, a partir da raiz do repo), o antigo
# `--env-file .env.local` procurava `.env.local` na raiz — que nem existe —
# e a chave sempre resolvia vazia (warning "N8N_ENCRYPTION_KEY is empty").
# `env_file:` abaixo é um mecanismo diferente: injeta as variáveis direto no
# container, com o caminho sempre relativo a ESTE arquivo (o "diretório do
# projeto" do Compose, já que nenhum `--project-directory` é passado) —
# funciona não importa de onde `docker compose` seja chamado.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ayon-creator-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    env_file:
      - .env.local
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # N8N_ENCRYPTION_KEY vem de `env_file` acima (n8n/.env.local) — nunca
      # redeclarar aqui com `${...}`: se a interpolação falhasse (ex. alguém
      # voltar a chamar com `--env-file` de outro diretório), um valor vazio
      # aqui teria PRECEDÊNCIA sobre o `env_file` e sobrescreveria a chave
      # correta silenciosamente — a mesma classe de bug que causou o warning
      # original, só que mascarada em vez de corrigida.
      # Instância só em http local (sem TLS) — cookie seguro quebraria o login.
      - N8N_SECURE_COOKIE=false
    volumes:
      - ayon_creator_n8n_data:/home/node/.n8n

volumes:
  ayon_creator_n8n_data:
    name: ayon_creator_n8n_data
